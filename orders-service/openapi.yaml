openapi: 3.0.3

info:
  title: CampusEats Orders Service
  version: "1.0.0"
  description: REST API for creating and managing CampusEats orders.

servers:
  - url: http://localhost:8082
    description: Local development server
  - url: https://api.campuseats.dev
    description: Production server

paths:

  /health:
    get:
      summary: Check service health
      operationId: healthCheck
      responses:
        "200":
          description: Orders service is healthy

  /orders:
    post:
      summary: Create a new order
      operationId: createOrder

      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Unique key used to safely retry the same order creation request.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"

      responses:
        "200":
          description: Original order returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

        "201":
          description: Order created successfully
          headers:
            Location:
              description: URL of the newly created order
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

        "422":
          description: Order cannot be fulfilled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

        "503":
          description: Required downstream service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

    get:
      summary: List orders
      operationId: listOrders

      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - placed
              - cancelled
          description: Filter orders by status.

      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /orders/{id}:
    get:
      summary: Get one order
      operationId: getOrder

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Order identifier.

      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /orders/{id}/cancellation:
    post:
      summary: Request order cancellation
      operationId: cancelOrder

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Order identifier.

      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResult"

        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

        "409":
          description: Order is not in a cancellable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

components:

  schemas:

    PlaceOrderRequest:
      type: object
      required:
        - studentId
        - items
        - deliveryAddressId
        - paymentMethodId
      properties:
        studentId:
          type: integer
          minimum: 1

        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemRequest"

        deliveryAddressId:
          type: integer
          minimum: 1

        paymentMethodId:
          type: integer
          minimum: 1

    OrderItemRequest:
      type: object
      required:
        - itemId
        - qty
      properties:
        itemId:
          type: integer
          minimum: 1

        qty:
          type: integer
          minimum: 1

    Order:
      type: object
      required:
        - orderId
        - status
        - total
        - estimatedMinutes
        - createdAt
      properties:
        orderId:
          type: integer
          minimum: 1

        status:
          type: string
          enum:
            - placed
            - cancelled

        total:
          type: integer
          minimum: 0
          description: Total amount in paise.

        estimatedMinutes:
          type: integer
          minimum: 0

        createdAt:
          type: string
          format: date-time

    CancellationResult:
      type: object
      required:
        - orderId
        - status
      properties:
        orderId:
          type: integer
          minimum: 1

        status:
          type: string
          enum:
            - cancelled

    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string

        title:
          type: string

        status:
          type: integer

        detail:
          type: string