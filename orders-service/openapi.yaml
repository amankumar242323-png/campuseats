openapi: 3.0.3
info:
  title: CampusEats Orders Service
  version: "1.2.0"
  description: >-
    REST API for creating and managing CampusEats orders. Includes validation,
    Problem Details errors, idempotent order creation, conditional requests,
    response negotiation, rate limits, and retry guidance.

servers:
  - url: http://localhost:8082
    description: Local development server
  - url: https://api.campuseats.dev
    description: Production server

tags:
  - name: Health
    description: Service health operations
  - name: Orders
    description: Order collection operations
  - name: Order
    description: Individual order operations

paths:
  /health:
    get:
      tags: [Health]
      summary: Check service health
      operationId: healthCheck
      responses:
        "200":
          description: Orders service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: orders
                  status:
                    type: string
                    example: alive
        default:
          $ref: '#/components/responses/ProblemResponse'

  /orders:
    options:
      tags: [Orders]
      summary: Advertise supported methods
      operationId: ordersOptions
      responses:
        "204":
          description: Supported methods
          headers:
            Allow:
              description: Methods supported by the orders collection
              schema:
                type: string
                example: 'GET, POST, OPTIONS'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'

    post:
      tags: [Orders]
      summary: Create an order
      operationId: createOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        "201":
          description: Order created successfully
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Content-Type:
              $ref: '#/components/headers/JsonContentType'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        "200":
          description: Existing order returned for an idempotent retry with the same key
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "406":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          description: Idempotency key conflicts with a different request or state transition
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "415":
          $ref: '#/components/responses/ProblemResponse'
        "422":
          description: Request validation failed, cart is empty, or item cannot be ordered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          description: Rate limit exceeded; retry only after the indicated delay
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "503":
          description: Catalogue or another required downstream service is temporarily unavailable
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "500":
          $ref: '#/components/responses/ProblemResponse'

    get:
      tags: [Orders]
      summary: List orders
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [placed, cancelled]
          description: Filter orders by status.
        - $ref: '#/components/parameters/AcceptHeader'
      responses:
        "200":
          description: List of orders
          headers:
            Content-Type:
              $ref: '#/components/headers/NegotiatedContentType'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
            application/xml:
              schema:
                type: string
                description: XML representation of the order list
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "406":
          $ref: '#/components/responses/ProblemResponse'
        "429":
          description: Rate limit exceeded
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'

    options:
      tags: [Order]
      summary: Advertise supported methods for an order
      operationId: orderOptions
      responses:
        "204":
          description: Supported methods
          headers:
            Allow:
              description: Methods supported by an individual order
              schema:
                type: string
                example: 'GET, PATCH, OPTIONS'

    get:
      tags: [Order]
      summary: Get one order
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/AcceptHeader'
      responses:
        "200":
          description: Order found
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
            application/xml:
              schema:
                type: string
                description: XML representation of the order
        "304":
          description: Order representation has not changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "406":
          $ref: '#/components/responses/ProblemResponse'
        "429":
          description: Rate limit exceeded
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    patch:
      tags: [Order]
      summary: Update order status
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AcceptHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        "200":
          description: Order status updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "406":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          description: Illegal order state transition
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "412":
          description: If-Match precondition failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "415":
          $ref: '#/components/responses/ProblemResponse'
        "422":
          $ref: '#/components/responses/ProblemResponse'
        "429":
          description: Rate limit exceeded
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    post:
      tags: [Order]
      summary: PATCH fallback using X-HTTP-Method-Override
      operationId: updateOrderStatusUsingMethodOverride
      description: >-
        Compatibility fallback for clients that cannot send PATCH.
        The client sends POST with X-HTTP-Method-Override: PATCH.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-HTTP-Method-Override
          required: true
          schema:
            type: string
            enum: [PATCH]
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        "200":
          description: Order status updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          $ref: '#/components/responses/ProblemResponse'
        "412":
          $ref: '#/components/responses/ProblemResponse'

  /orders/{id}/cancellation:
    parameters:
      - $ref: '#/components/parameters/OrderId'

    options:
      tags: [Order]
      summary: Advertise cancellation methods
      operationId: cancellationOptions
      responses:
        "204":
          description: Supported cancellation methods
          headers:
            Allow:
              schema:
                type: string
                example: 'POST, OPTIONS'

    post:
      tags: [Order]
      summary: Request order cancellation
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptHeader'
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResult'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "406":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          description: Order is not in a cancellable state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          description: Rate limit exceeded
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrderId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
      description: Order identifier.

    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
      description: >-
        Unique key used to safely retry the same order creation request
        without creating a duplicate.

    AcceptHeader:
      in: header
      name: Accept
      required: false
      schema:
        type: string
        default: application/json
      description: >-
        Requested response media type. JSON is the default; XML may be
        supported for selected order read operations.

    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      schema:
        type: string
      description: Matching ETag returns 304 Not Modified.

    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
      description: Current ETag; a mismatch returns 412 Precondition Failed.

  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string
        example: /orders/1

    ETag:
      description: Entity tag representing the current resource representation.
      schema:
        type: string
        example: '"a3f5d7..."'

    CacheControl:
      description: Cache policy for the response.
      schema:
        type: string
        example: no-store

    RetryAfter:
      description: Seconds to wait before retrying. Do not immediately retry a 429 or 503.
      schema:
        type: integer
        example: 5

    JsonContentType:
      description: JSON response media type, including UTF-8 charset.
      schema:
        type: string
        example: 'application/json; charset=utf-8'

    NegotiatedContentType:
      description: Negotiated response media type.
      schema:
        type: string
        example: 'application/json; charset=utf-8'

    AccessControlAllowOrigin:
      description: Allowed cross-origin origin.
      schema:
        type: string
        example: '*'

    AccessControlAllowMethods:
      description: HTTP methods allowed for CORS.
      schema:
        type: string
        example: 'GET, POST, PATCH, OPTIONS'

    AccessControlAllowHeaders:
      description: Request headers allowed for CORS.
      schema:
        type: string
        example: 'Content-Type, Accept, Authorization, Idempotency-Key, If-Match'

    XRateLimitLimit:
      description: Maximum requests allowed in the rate-limit window.
      schema:
        type: integer
        example: 100

    XRateLimitRemaining:
      description: Requests remaining in the current rate-limit window.
      schema:
        type: integer
        example: 99

  responses:
    ProblemResponse:
      description: Request failed. Response uses Problem Details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    PlaceOrderRequest:
      type: object
      required:
        - studentId
        - items
        - deliveryAddressId
        - paymentMethodId
      properties:
        studentId:
          type: integer
          minimum: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        deliveryAddressId:
          type: integer
          minimum: 1
        paymentMethodId:
          type: integer
          minimum: 1

    OrderItemRequest:
      type: object
      required:
        - itemId
        - qty
      properties:
        itemId:
          type: integer
          minimum: 1
        qty:
          type: integer
          minimum: 1

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [placed, cancelled]

    Order:
      type: object
      required:
        - orderId
        - status
        - total
        - estimatedMinutes
        - createdAt
      properties:
        orderId:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [placed, cancelled]
        total:
          type: integer
          minimum: 0
          description: Total amount in paise.
        estimatedMinutes:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time

    CancellationResult:
      type: object
      required:
        - orderId
        - status
      properties:
        orderId:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [cancelled]

    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: Stable problem-type URI.
          example: /errors/invalid-request
        title:
          type: string
          description: Short, human-readable problem summary.
          example: Invalid request
        status:
          type: integer
          description: HTTP status code.
          example: 422
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: The request body failed validation.
        errors:
          type: array
          description: Field-level validation errors when the request has multiple invalid fields.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                example: items[0].qty
              message:
                type: string
                example: must be a positive integer