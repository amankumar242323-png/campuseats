openapi: 3.0.3

info:
  title: CampusEats Orders Service
  version: "1.1.0"
  description: REST API for creating and managing CampusEats orders with HTTP method, header, caching, conditional request, authorization, CORS and retry-safety support.

servers:
  - url: http://localhost:8082
    description: Local development server

  - url: https://api.campuseats.dev
    description: Production server


tags:
  - name: Health
    description: Service health operations

  - name: Orders
    description: Order collection operations

  - name: Order
    description: Individual order operations


paths:

  # ==========================================================
  # HEALTH
  # ==========================================================

  /health:

    get:
      tags:
        - Health

      summary: Check service health
      operationId: healthCheck

      responses:

        "200":
          description: Orders service is healthy

          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"

            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"

            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"

            Strict-Transport-Security:
              $ref: "#/components/headers/Strict-Transport-Security"

          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: orders

                  status:
                    type: string
                    example: alive


  # ==========================================================
  # ORDERS COLLECTION
  # ==========================================================

  /orders:

    options:
      tags:
        - Orders

      summary: Advertise supported methods
      operationId: ordersOptions

      responses:

        "204":
          description: Supported methods

          headers:

            Allow:
              description: Methods supported by the orders collection
              schema:
                type: string
                example: GET, POST, OPTIONS

            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"

            Access-Control-Allow-Methods:
              $ref: "#/components/headers/Access-Control-Allow-Methods"

            Access-Control-Allow-Headers:
              $ref: "#/components/headers/Access-Control-Allow-Headers"


    # --------------------------------------------------------
    # POST /orders
    # --------------------------------------------------------

    post:
      tags:
        - Orders

      summary: Create a new order
      operationId: createOrder

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/IdempotencyKey"

        - $ref: "#/components/parameters/AcceptHeader"

      requestBody:
        required: true

        content:

          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"

      responses:

        "200":
          description: Original order returned for an idempotent retry

          headers:

            Location:
              $ref: "#/components/headers/Location"

            Cache-Control:
              $ref: "#/components/headers/Cache-Control"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"


        "201":
          description: Order created successfully

          headers:

            Location:
              description: URL of the newly created order
              schema:
                type: string
                example: /orders/1

            Cache-Control:
              $ref: "#/components/headers/Cache-Control"

            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"


        "400":
          description: Invalid request

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "401":
          description: Missing or invalid Authorization header

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "406":
          description: Requested response format is not supported

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "422":
          description: Order cannot be fulfilled

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "429":
          description: Rate limit exceeded

          headers:

            Retry-After:
              $ref: "#/components/headers/Retry-After"

            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "503":
          description: Required downstream service is unavailable

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


    # --------------------------------------------------------
    # GET /orders
    # --------------------------------------------------------

    get:
      tags:
        - Orders

      summary: List orders
      operationId: listOrders

      security:
        - bearerAuth: []

      parameters:

        - in: query
          name: status
          required: false

          schema:
            type: string

            enum:
              - placed
              - cancelled

          description: Filter orders by status.

        - $ref: "#/components/parameters/AcceptHeader"

      responses:

        "200":
          description: List of orders

          headers:

            Cache-Control:
              $ref: "#/components/headers/Cache-Control"

            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"

            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"

          content:
            application/json:

              schema:
                type: array

                items:
                  $ref: "#/components/schemas/Order"


        "400":
          description: Invalid query parameter

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "401":
          description: Missing or invalid Authorization header

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "406":
          description: Requested response format is not supported

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "429":
          description: Rate limit exceeded

          headers:

            Retry-After:
              $ref: "#/components/headers/Retry-After"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


  # ==========================================================
  # INDIVIDUAL ORDER
  # ==========================================================

  /orders/{id}:

    options:
      tags:
        - Order

      summary: Advertise supported methods for an order
      operationId: orderOptions

      parameters:

        - $ref: "#/components/parameters/OrderId"

      responses:

        "204":
          description: Supported methods

          headers:

            Allow:
              description: Methods supported by an individual order
              schema:
                type: string
                example: GET, PATCH, OPTIONS

            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"

            Access-Control-Allow-Methods:
              $ref: "#/components/headers/Access-Control-Allow-Methods"

            Access-Control-Allow-Headers:
              $ref: "#/components/headers/Access-Control-Allow-Headers"


    # --------------------------------------------------------
    # GET /orders/{id}
    # --------------------------------------------------------

    get:
      tags:
        - Order

      summary: Get one order
      operationId: getOrder

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/OrderId"

        - $ref: "#/components/parameters/IfNoneMatch"

        - $ref: "#/components/parameters/AcceptHeader"

      responses:

        "200":
          description: Order found

          headers:

            ETag:
              $ref: "#/components/headers/ETag"

            Cache-Control:
              $ref: "#/components/headers/Cache-Control"

            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"

            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"


        "304":
          description: Order representation has not changed

          headers:

            ETag:
              $ref: "#/components/headers/ETag"

            Cache-Control:
              $ref: "#/components/headers/Cache-Control"


        "401":
          description: Missing or invalid Authorization header

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "404":
          description: Order not found

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "406":
          description: Requested response format is not supported

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "429":
          description: Rate limit exceeded

          headers:

            Retry-After:
              $ref: "#/components/headers/Retry-After"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


    # --------------------------------------------------------
    # PATCH /orders/{id}
    # --------------------------------------------------------

    patch:
      tags:
        - Order

      summary: Update order status
      operationId: updateOrderStatus

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/OrderId"

        - $ref: "#/components/parameters/IfMatch"

        - $ref: "#/components/parameters/AcceptHeader"

      requestBody:
        required: true

        content:

          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"

      responses:

        "200":
          description: Order status updated

          headers:

            ETag:
              $ref: "#/components/headers/ETag"

            Cache-Control:
              $ref: "#/components/headers/Cache-Control"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"


        "400":
          description: Invalid request

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "401":
          description: Missing or invalid Authorization header

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "404":
          description: Order not found

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "406":
          description: Requested response format is not supported

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "412":
          description: If-Match precondition failed

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "429":
          description: Rate limit exceeded

          headers:

            Retry-After:
              $ref: "#/components/headers/Retry-After"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


    # --------------------------------------------------------
    # POST fallback for X-HTTP-Method-Override
    # --------------------------------------------------------

    post:
      tags:
        - Order

      summary: PATCH fallback using X-HTTP-Method-Override
      operationId: updateOrderStatusUsingMethodOverride

      description: >
        Compatibility fallback for constrained clients that cannot send PATCH.
        The client sends POST with X-HTTP-Method-Override: PATCH.

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/OrderId"

        - in: header
          name: X-HTTP-Method-Override
          required: true

          schema:
            type: string
            enum:
              - PATCH

          description: HTTP method to use for the compatibility request.

        - $ref: "#/components/parameters/IfMatch"

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"

      responses:

        "200":
          description: Order status updated

          headers:

            ETag:
              $ref: "#/components/headers/ETag"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"


        "400":
          description: Invalid method override or request

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "401":
          description: Unauthorized

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "404":
          description: Order not found

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "412":
          description: If-Match precondition failed

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


  # ==========================================================
  # CANCELLATION
  # ==========================================================

  /orders/{id}/cancellation:

    options:
      tags:
        - Order

      summary: Advertise cancellation methods
      operationId: cancellationOptions

      parameters:

        - $ref: "#/components/parameters/OrderId"

      responses:

        "204":
          description: Supported cancellation methods

          headers:

            Allow:
              description: Methods supported by cancellation resource
              schema:
                type: string
                example: POST, OPTIONS

            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"


    post:
      tags:
        - Order

      summary: Request order cancellation
      operationId: cancelOrder

      security:
        - bearerAuth: []

      parameters:

        - $ref: "#/components/parameters/OrderId"

        - $ref: "#/components/parameters/AcceptHeader"

      responses:

        "202":
          description: Cancellation accepted

          headers:

            Cache-Control:
              $ref: "#/components/headers/Cache-Control"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResult"


        "401":
          description: Missing or invalid Authorization header

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "404":
          description: Order not found

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "409":
          description: Order is not in a cancellable state

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "406":
          description: Requested response format is not supported

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


        "429":
          description: Rate limit exceeded

          headers:

            Retry-After:
              $ref: "#/components/headers/Retry-After"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


# ============================================================
# COMPONENTS
# ============================================================

components:

  # ==========================================================
  # SECURITY
  # ==========================================================

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # ==========================================================
  # PARAMETERS
  # ==========================================================

  parameters:

    OrderId:
      in: path
      name: id
      required: true

      schema:
        type: integer
        minimum: 1

      description: Order identifier.


    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true

      schema:
        type: string
        minLength: 1

      description: >
        Unique key used to safely retry the same order creation
        request without creating a duplicate order.


    AcceptHeader:
      in: header
      name: Accept
      required: false

      schema:
        type: string
        default: application/json

      description: >
        Requested response media type. The service supports application/json.


    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false

      schema:
        type: string

      description: >
        ETag previously returned by the server. Matching values result
        in 304 Not Modified.


    IfMatch:
      in: header
      name: If-Match
      required: true

      schema:
        type: string

      description: >
        Current ETag of the resource. A mismatch returns
        412 Precondition Failed.


  # ==========================================================
  # RESPONSE HEADERS
  # ==========================================================

  headers:

    Location:
      description: URL of the created resource.

      schema:
        type: string
        example: /orders/1


    ETag:
      description: Entity tag representing the current resource representation.

      schema:
        type: string
        example: "\"a3f5d7...\""


    Cache-Control:
      description: Cache policy for the response.

      schema:
        type: string
        example: no-store


    Retry-After:
      description: Number of seconds before the client should retry.

      schema:
        type: integer
        example: 60


    X-RateLimit-Limit:
      description: Maximum number of requests allowed in the rate-limit window.

      schema:
        type: integer
        example: 60


    X-RateLimit-Remaining:
      description: Number of requests remaining in the current rate-limit window.

      schema:
        type: integer
        example: 59


    Access-Control-Allow-Origin:
      description: Allowed cross-origin origin.

      schema:
        type: string
        example: "*"


    Access-Control-Allow-Methods:
      description: HTTP methods allowed for CORS.

      schema:
        type: string
        example: GET, POST, PATCH, OPTIONS


    Access-Control-Allow-Headers:
      description: Request headers allowed for CORS.

      schema:
        type: string
        example: Content-Type, Accept, Authorization, Idempotency-Key, If-Match


    X-Content-Type-Options:
      description: Prevents MIME sniffing.

      schema:
        type: string
        example: nosniff


    Strict-Transport-Security:
      description: Requires HTTPS in supporting clients.

      schema:
        type: string
        example: max-age=31536000; includeSubDomains


  # ==========================================================
  # SCHEMAS
  # ==========================================================

  schemas:

    PlaceOrderRequest:

      type: object

      required:
        - studentId
        - items
        - deliveryAddressId
        - paymentMethodId

      properties:

        studentId:
          type: integer
          minimum: 1


        items:
          type: array
          minItems: 1

          items:
            $ref: "#/components/schemas/OrderItemRequest"


        deliveryAddressId:
          type: integer
          minimum: 1


        paymentMethodId:
          type: integer
          minimum: 1


    OrderItemRequest:

      type: object

      required:
        - itemId
        - qty

      properties:

        itemId:
          type: integer
          minimum: 1


        qty:
          type: integer
          minimum: 1


    UpdateOrderStatusRequest:

      type: object

      required:
        - status

      properties:

        status:
          type: string

          enum:
            - placed
            - cancelled


    Order:

      type: object

      required:
        - orderId
        - status
        - total
        - estimatedMinutes
        - createdAt

      properties:

        orderId:
          type: integer
          minimum: 1


        status:
          type: string

          enum:
            - placed
            - cancelled


        total:
          type: integer
          minimum: 0

          description: Total amount in paise.


        estimatedMinutes:
          type: integer
          minimum: 0


        createdAt:
          type: string
          format: date-time


    CancellationResult:

      type: object

      required:
        - orderId
        - status

      properties:

        orderId:
          type: integer
          minimum: 1


        status:
          type: string

          enum:
            - cancelled


    Problem:

      type: object

      required:
        - type
        - title
        - status
        - detail

      properties:

        type:
          type: string
          example: /errors/order-not-found


        title:
          type: string
          example: Order not found


        status:
          type: integer
          example: 404


        detail:
          type: string
          example: No order 999


        errors:
          type: array

          items:
            type: array

            items:
              type: string