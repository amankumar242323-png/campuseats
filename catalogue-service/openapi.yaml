openapi: 3.0.3

info:
  title: CampusEats Catalogue Service
  version: "1.0.0"
  description: >
    REST API for the CampusEats Catalogue Service.
    The service owns restaurants, menus and food items.

servers:
  - url: http://localhost:8081

paths:

  /menu-items:

    post:
      summary: Create a menu item
      operationId: createMenuItem

      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemCreate"

      responses:
        "201":
          description: Menu item created
          headers:
            Location:
              description: URI of the newly created menu item
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

        "409":
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

        "422":
          description: Domain validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


    get:
      summary: Search menu items
      operationId: searchFood

      parameters:
        - in: query
          name: search
          required: true
          schema:
            type: string
            minLength: 1

      responses:

        "200":
          description: Matching menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"

        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


  /menu-items/{id}:

    get:
      summary: Get menu item
      operationId: itemDetails

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1

      responses:

        "200":
          description: Menu item found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"

        "404":
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


  /menu-items/{id}/availability:

    patch:
      summary: Change menu item availability
      operationId: setAvailability

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityUpdate"

      responses:

        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

        "404":
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

        "409":
          description: State conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


  /restaurants/{restaurant_id}/menu:

    get:
      summary: Get restaurant menu
      operationId: getMenu

      parameters:
        - in: path
          name: restaurant_id
          required: true
          schema:
            type: integer
            minimum: 1

      responses:

        "200":
          description: Restaurant menu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"

        "404":
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"


components:

  schemas:

    MenuItemCreate:
      type: object
      required:
        - restaurantId
        - menuId
        - name
        - price
      properties:
        restaurantId:
          type: integer
          minimum: 1

        menuId:
          type: integer
          minimum: 1

        name:
          type: string
          minLength: 1

        description:
          type: string

        price:
          type: number
          minimum: 0.01

        available:
          type: boolean
          default: true


    AvailabilityUpdate:
      type: object
      required:
        - available
      properties:
        available:
          type: boolean


    MenuItem:
      type: object
      required:
        - id
        - restaurantId
        - menuId
        - name
        - price
        - available
      properties:
        id:
          type: integer

        restaurantId:
          type: integer

        menuId:
          type: integer

        name:
          type: string

        description:
          type: string

        price:
          type: number

        available:
          type: boolean


    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string

        title:
          type: string

        status:
          type: integer

        detail:
          type: string